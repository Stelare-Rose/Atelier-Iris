# Monitor
source = ~/.config/hypr/monitor.conf

# Camelia
source = ~/.config/hypr/auxiliary/camelia-binds.conf

# Programs
$terminal = wezterm
$fileManager = dolphin
$menu = rofi -show combi -combi-modi "window,drun,ssh" -modi combi -display-drun "Run"

# Autostart
exec-once = hyprpaper
exec-once = waybar
exec-once = swaync
exec-once = [workspace special:obsidian silent] obsidian
exec-once = [workspace special:pyxis silent] Pyxis
exec-once = sunshine
exec = wlsunset -d 1800 -t 5000 -S 8:00 -s 18:00

# Cursor, because... yeah.
exec = hyprctl setcursor StarryCursor 24

# Environment Variables 
env = GTK_USE_PORTAL,1

# Feel
general { 
		gaps_in = 1
		gaps_out = 2 2 2 2 

		border_size = 2

		col.active_border = rgb(CF8282) rgb(D4A266) rgb(E3CD7F) rgb(9CCC96) rgb(90CDDE) rgb(9BB0DE) rgb(9B98D6) rgb(CCA3D6) rgb(DBB4D3) rgb(EDB7CA) 25deg
		col.inactive_border = rgba(EDB7CAff)

		resize_on_border = false 

		allow_tearing = false

		layout = dwindle
}

# Decor
decoration {
	rounding = 4
	dim_inactive = false
	dim_strength = 0.125
	shadow {
		enabled = false
		range = 4
		color = 0xee1a1a1a
		sharp = true
	}
	blur {
		enabled = true
		size = 5
		passes = 1
		vibrancy = 0.1696
	}
}

# Animations
animations {
	enabled = true
	bezier = myBezier, 0.05, 0.9, 0.1, 1.05
	bezier = workspaces, 0.01, 1, 0.5, 1
	bezier = border, 0.37, 0, 0.63, 1

	animation = windows, 1, 7, myBezier
	animation = windowsOut, 1, 7, default, popin 80%
	animation = border, 1, 6, default
	animation = borderangle, 1, 6, default	
	animation = fade, 1, 7, default
	animation = workspaces, 1, 6, workspaces
}

# Layout
dwindle {
	preserve_split = true
}

master {
	new_status = master
}

# Misc
misc { 
	force_default_wallpaper = 1
	disable_hyprland_logo = true
}

render {
    direct_scanout = false
}

input {
	kb_layout = us
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1

	sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

	touchpad {
		natural_scroll = false
	}
}

xwayland {
  force_zero_scaling = true
}

# Keybinds
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, T, pin, # dwindle
bind = $mainMod, J, pseudo, # dwindle

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, steam
bind = $mainMod SHIFT, S, movetoworkspace, special:steam

bind = $mainMod, D, togglespecialworkspace, discord
bind = $mainMod SHIFT, D, movetoworkspace, special:discord

bind = $mainMod, K, togglespecialworkspace, developer
bind = $mainMod SHIFT, K, movetoworkspace, special:developer

bind = $mainMod, P, togglespecialworkspace, pyxis
bind = $mainMod SHIFT, P, movetoworkspace, special:pyxis

bind = $mainMod, A, togglespecialworkspace, special
bind = $mainMod SHIFT, A, movetoworkspace, special:special

bind = $mainMod, O, togglespecialworkspace, obsidian
bind = $mainMod SHIFT, O, movetoworkspace, special:obsidian
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = CTRL, SPACE, exec, pkill rofi || $menu
bind = $mainMod, SPACE, exec, pkill rofi || $menu
bind = $mainMod, F, exec, pkill rofi || rofi -show calc -modi calc -no-show-match -no-sort -calc-command "echo -n '{result}' | wl-copy" -kb-accept-custom 'Control+Return'
bind = $mainMod, B, exec, pkill rofi || rofi-rbw
bind = $mainMod, E, exec, pkill rofi || rofi-network-manager 
bind = , PRINT, exec, hyprshot -z -m output --clipboard-only
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, PRINT, exec, hyprshot -z -m region --clipboard-only
bind = $mainMod SHIFT, W, exec, pkill waybar || waybar
bind = CTRL SHIFT, C, exec, pkill dotool
bind = $mainMod SHIFT, f, fullscreen

# Windowrules
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}

windowrule {
  name = windowrule-2
  float = on
  match:title = Picture-in-Picture
}

windowrule {
  name = windowrule-3
  workspace = special:steam silent
  match:title = ^(Steam)$
}

windowrule {
  name = windowrule-4
  workspace = special:steam silent
  match:class = ^(steam)$
}

windowrule {
  name = windowrule-5
  workspace = special:discord silent
  match:class = ^(discord)$
}

windowrule {
  name = windowrule-6
  workspace = special:discord silent
  match:class = ^(vesktop)$
}

windowrule {
  name = windowrule-7
  float = on
  match:class = packettracer
}

windowrule {
  name = ihatezoom
  float = on
  match:title = annotate_toolbar
}

windowrule {
  name = windowrule-8
  float = on
  match:class = yazi-picker
}

windowrule {
  name = windowrule-9
  size = (monitor_w*0.6) (monitor_h*0.6)
  center = on
  focus_on_activate = on
  match:class = ^(yazi-picker)$
}

windowrule {
  name = windowrule-10
  no_focus = on
  match:title = ^(Marking Menu)$
}


# Dev Things (Still WindowRules)
windowrule {
  name = windowrule-11
  float = on
  match:class = Emulator
}

windowrule {
  name = windowrule-12
  workspace = special:developer
  match:title = dev-Pyxis
}

windowrule {
  name = windowrule-13
  workspace = special:pyxis
  match:title = Pyxis
}

windowrule {
  name = windowrule-14
  float = on
  size = (monitor_w*0.8) (monitor_h*0.8)
  center = on
  match:class = mpv 
}

windowrule {
  name = hoyoplaypain
  size = 1920 1080
  match:class = ^(hoyoplay|HoYoPlay)$
}


# Layerrules
