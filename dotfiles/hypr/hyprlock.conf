general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
    no_fade_out = false
    fade_in_time = 500
    fade_out_time = 300
}

background {
    monitor =
    path = ~/.config/hypr/backgrounds/starlock.png
    color = rgba(46, 46, 46, 1.0)
}

label {
    monitor =
    text = $TIME
    font_size = 36
    font_family = monospace
    color = rgba(248, 244, 233, 1.0)
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 12
    font_family = monospace
    color = rgba(222, 206, 193, 1.0)
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] echo "<span foreground='#cf8282'>cpu $(grep -m1 'cpu ' /proc/stat | awk '{u=$2+$4; t=$2+$3+$4+$5} END{print u,t}' > /tmp/cpu1; sleep 0.5; grep -m1 'cpu ' /proc/stat | awk -v f=/tmp/cpu1 'BEGIN{getline l < f; split(l,a)} {du=$2+$4-a[1]; dt=$2+$3+$4+$5-a[2]; print int(du/dt*100)}')%</span> <span foreground='#4d4d4d'>·</span> <span foreground='#d4a266'>ram $(free -m | awk '/^Mem/{printf "%.0f/%.0fg", $3/1024, $2/1024}')</span> <span foreground='#4d4d4d'>·</span> <span foreground='#9ccc96'>bat $(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)%</span>"
    font_size = 11
    font_family = monospace
    color = rgba(248, 244, 233, 1.0)
    position = 0, -55
    width = 800
    halign = center
    valign = top
}

input-field {
    monitor =
    size = 152, 34
    position = 0, -60
    halign = center
    valign = center

    outline_thickness = 2
    outer_color = rgba(219, 180, 211, 1.0)
    inner_color = rgba(59, 59, 59, 1.0)
    font_color = rgba(237, 183, 202, 1.0)
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.3
    dots_rounding = -1

    rounding = -1

    fade_on_empty = true
    placeholder_text = <span foreground="#616161">enter password</span>
    shadow_passes = 0

    check_color = rgba(153, 207, 172, 1.0)
    fail_color = rgba(207, 130, 130, 1.0)
    fail_text = <span foreground="#cf8282">incorrect</span>
}
